[build]
  command = "node inject-env.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# ==========================================
# URL REDIRECTS
# ==========================================

# Specific page redirects for better SEO
[[redirects]]
  from = "/send"
  to = "/?tab=send"
  status = 301

[[redirects]]
  from = "/receive"
  to = "/?tab=receive"
  status = 301

[[redirects]]
  from = "/about"
  to = "/how-it-works"
  status = 301

[[redirects]]
  from = "/api/signaling"
  to = "/.netlify/functions/signaling"
  status = 200

# ==========================================
# SECURITY HEADERS
# ==========================================

[[headers]]
  for = "/*"
  [headers.values]
    # Security Headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    # CSP - Content Security Policy (allows Firestore API, Google Fonts, WebSockets, STUN/TURN, and Source Maps)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.gstatic.com https://www.gstatic.com https://firestore.googleapis.com https://*.googleapis.com https://firebase.googleapis.com https://*.firebaseio.com https://*.firebase.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https: wss:; manifest-src 'self'"

    # SEO & Meta
    X-UA-Compatible = "IE=Edge"

# ==========================================
# CACHE CONTROL
# ==========================================

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml; charset=utf-8"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/*.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json; charset=utf-8"

# ==========================================
# API RESPONSES
# ==========================================

[[headers]]
  for = "/.netlify/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

# ==========================================
# COMPRESSION & PERFORMANCE
# ==========================================

[context.production]
  command = "node inject-env.js"

[context.production.environment]
  NODE_ENV = "production"
  GZIP = "true"
  BROTLI = "true"

# ==========================================
# FUNCTIONS
# ==========================================

[functions]
  directory = "functions"
  node_bundler = "esbuild"
  included_files = ["functions/**/*"]